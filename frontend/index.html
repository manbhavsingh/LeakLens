<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LeakLens — Revenue Intelligence</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root { font-family: Inter, system-ui, sans-serif; color: #e8edf5; background: #0a0d12; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(circle at top right, #182233, #0a0d12 42%); }
    .shell { max-width: 1320px; margin: auto; padding: 32px; }
    header { display:flex; justify-content:space-between; align-items:center; gap:20px; margin-bottom:28px; }
    .brand { font-size: 28px; font-weight: 800; letter-spacing:-.04em; }
    .brand span { color:#62e6a8; }
    .subtitle { color:#8f9bab; margin-top:5px; }
    button { border:0; border-radius:10px; padding:11px 16px; background:#62e6a8; color:#07110b; font-weight:750; cursor:pointer; }
    button:disabled { opacity:.5; cursor:wait; }
    .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:18px; }
    .card { background:#11161f; border:1px solid #202936; border-radius:14px; padding:18px; box-shadow:0 10px 30px #0003; }
    .label { color:#8f9bab; font-size:12px; text-transform:uppercase; letter-spacing:.08em; }
    .metric { font-size:30px; font-weight:800; margin-top:8px; }
    .layout { display:grid; grid-template-columns:1.4fr .9fr; gap:18px; }
    h2 { margin:0 0 16px; font-size:18px; }
    .finding { padding:15px; border-radius:11px; background:#0d1219; border:1px solid #263142; margin-bottom:10px; }
    .finding strong { display:block; margin-bottom:6px; }
    .muted { color:#8f9bab; font-size:13px; }
    .pill { display:inline-block; margin-top:10px; padding:5px 8px; border-radius:999px; background:#1c352b; color:#72e9ac; font-size:11px; }
    .trace { border-left:2px solid #2b394a; padding-left:15px; }
    .step { margin-bottom:16px; }
    .step b { font-size:13px; }
    pre { white-space:pre-wrap; color:#aeb8c7; font-size:12px; line-height:1.5; }
    .status { color:#72e9ac; }
    @media(max-width:900px){ .grid,.layout{grid-template-columns:1fr 1fr;} }
    @media(max-width:600px){ .grid,.layout{grid-template-columns:1fr;} .shell{padding:18px;} }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div><div class="brand">Leak<span>Lens</span></div><div class="subtitle">AI revenue leakage investigator</div></div>
      <button id="run">Run demo investigation</button>
    </header>

    <section class="grid">
      <div class="card"><div class="label">Transactions</div><div class="metric" id="transactions">—</div></div>
      <div class="card"><div class="label">Revenue at risk</div><div class="metric" id="risk">—</div></div>
      <div class="card"><div class="label">Findings</div><div class="metric" id="findings">—</div></div>
      <div class="card"><div class="label">Policy</div><div class="metric status" id="policy">—</div></div>
    </section>

    <section class="layout">
      <div class="card">
        <h2>Highest-priority leak</h2>
        <div id="finding" class="finding"><span class="muted">Run an investigation to populate evidence.</span></div>
        <canvas id="conversionChart" height="130"></canvas>
      </div>
      <div class="card">
        <h2>Investigation trace</h2>
        <div id="trace" class="trace"><span class="muted">No investigation yet.</span></div>
      </div>
    </section>
  </main>
<script>
let chart;
const $ = id => document.getElementById(id);
async function run() {
  $('run').disabled = true; $('run').textContent = 'Investigating…';
  try {
    const response = await fetch('http://localhost:8000/demo/evaluate', { method:'POST' });
    if (!response.ok) throw new Error('API returned ' + response.status);
    const data = await response.json();
    $('transactions').textContent = data.transaction_count.toLocaleString();
    $('risk').textContent = '₹' + Number(data.ground_truth_revenue_at_risk).toLocaleString('en-IN');
    $('findings').textContent = data.detected_findings;
    $('policy').textContent = data.policy_allowed ? 'ALLOWED' : 'BLOCKED';

    const f = data.top_finding;
    $('finding').innerHTML = `<strong>${f.title}</strong><div class="muted">Cohort: ${f.cohort.payment_method.toUpperCase()} + ${f.cohort.device}</div><div class="muted">Conversion: ${(f.conversion_rate*100).toFixed(1)}% vs ${(f.baseline_conversion_rate*100).toFixed(1)}% baseline</div><div class="muted">Drop: ${(f.conversion_drop*100).toFixed(1)} percentage points</div><div class="pill">${data.recommended_action}</div>`;
    $('trace').innerHTML = `<div class="step"><b>HYPOTHESIS</b><pre>${data.hypothesis || '—'}</pre></div><div class="step"><b>ACTION</b><pre>${data.recommended_action || '—'}</pre></div><div class="step"><b>POLICY</b><pre>${data.policy_allowed ? 'Approved by bounded policy gate.' : 'Rejected by bounded policy gate.'}</pre></div>`;
    if (chart) chart.destroy();
    chart = new Chart($('conversionChart'), { type:'bar', data:{labels:['Cohort','Baseline'],datasets:[{label:'Conversion',data:[f.conversion_rate*100,f.baseline_conversion_rate*100]}]}, options:{plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,max:100}}}});
  } catch (error) { $('trace').innerHTML = `<span class="muted">Could not reach API: ${error.message}</span>`; }
  finally { $('run').disabled=false; $('run').textContent='Run demo investigation'; }
}
$('run').addEventListener('click', run);
</script>
</body>
</html>
